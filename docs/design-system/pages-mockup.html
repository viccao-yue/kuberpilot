<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KuberPilot — 运维智能体平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =============================================
   KuberPilot Design System v3.0 — Industrial Ops Premium
   Ardot principles: NO Inter, NO pure gray, NO cookie-cutter,
   NO 3-column cards, NO centered hero, Bento Grid,
   Geist typeface, asymmetric layouts, flat sections,
   compact dot+text status, organic data
   ============================================= */
:root {
  /* Primary — authoritative deep navy, not generic Tailwind blue */
  --c-primary: #1a365d;
  --c-primary-soft: #3b6fa0;
  --c-primary-bg: #eef4fb;
  --c-primary-hover: #234876;
  --c-primary-text: #fff;

  /* Neutral — blue-tinted Zinc, NOT pure gray */
  --c-surface-0: #f4f6f9;
  --c-surface-1: #ffffff;
  --c-surface-2: #eaeef4;
  --c-surface-3: #dce2eb;
  --c-border: #c9d3de;
  --c-border-soft: #dde4ed;

  /* Text hierarchy — weight+color, not just size */
  --t-heading: #0f1d2e;
  --t-body: #334155;
  --t-muted: #64748b;
  --t-faint: #94a3b8;
  --t-white: #fff;

  /* Semantic */
  --c-ok: #16a34a;
  --c-ok-bg: #f0fdf4;
  --c-ok-soft: #bbf7d0;
  --c-warn: #d97706;
  --c-warn-bg: #fffbeb;
  --c-warn-soft: #fde68a;
  --c-danger: #dc2626;
  --c-danger-bg: #fef2f2;
  --c-danger-soft: #fecaca;

  /* Type — Geist, Ardot recommended */
  --f-ui: 'Geist','Noto Sans SC',system-ui,-apple-system,sans-serif;
  --f-mono: 'Geist Mono','JetBrains Mono','Fira Code',monospace;
  --fs-xs: 0.7rem;     /* 11.2px */
  --fs-sm: 0.8125rem;  /* 13px */
  --fs-base: 0.9rem;   /* 14.4px — ops tools, slightly smaller */
  --fs-md: 1rem;       /* 16px */
  --fs-lg: 1.125rem;
  --fs-xl: 1.25rem;
  --fs-2xl: 1.5rem;
  --fs-3xl: 2rem;
  --fw-light: 300; --fw-n: 400; --fw-m: 500; --fw-s: 600; --fw-b: 700;

  /* Space — 4pt grid, varied rhythm */
  --sp-0:0;--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;
  --sp-5:20px;--sp-6:24px;--sp-8:32px;--sp-10:40px;--sp-12:48px;
  --sp-16:64px;--sp-20:80px;

  /* Radius — sharp for data, soft for friendly */
  --r-xs:2px;--r-sm:4px;--r-md:6px;--r-lg:10px;--r-xl:16px;--r-pill:9999px;

  /* Shadows — tinted, not generic */
  --sh-0:none;
  --sh-1:0 1px 0 0 #c9d3de;
  --sh-2:0 2px 8px -2px rgba(26,54,93,.1);
  --sh-3:0 8px 24px -6px rgba(26,54,93,.12);
  --sh-elevate:0 12px 40px -8px rgba(26,54,93,.16), 0 4px 12px -4px rgba(26,54,93,.08);

  /* Layout constants — tighter than AI defaults */
  --nav-w: 168px;
  --top-h: 44px;
  --ease: cubic-bezier(.16,1,.3,1);
  --max-w: 1400px;
}

/* Reset */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{font-family:var(--f-ui);color:var(--t-body);background:var(--c-surface-0);line-height:1.5;overflow:hidden;height:100vh;font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit;border:none;outline:none}

/* =============================================
   Shell — Left-aligned, NOT centered
   ============================================= */
.shell{display:flex;height:100vh}

/* Nav — flat, no backdrop-filter, compact */
.nav{width:var(--nav-w);background:var(--c-surface-1);border-right:1px solid var(--c-border-soft);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.nav-brand{padding:var(--sp-3) var(--sp-4);display:flex;align-items:center;gap:var(--sp-2);border-bottom:1px solid var(--c-border-soft)}
.nav-mark{width:26px;height:26px;background:var(--c-primary);border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;color:var(--c-primary-text);font-weight:var(--fw-b);font-size:var(--fs-sm);letter-spacing:-0.04em}
.nav-title{font-size:var(--fs-sm);font-weight:var(--fw-s);color:var(--t-heading);letter-spacing:-0.02em}
.nav-tag{font-size:var(--fs-xs);color:var(--t-faint);margin-left:2px;font-weight:var(--fw-n)}

.nav-group{padding:var(--sp-1) 0}
.nav-group-label{font-size:var(--fs-xs);color:var(--t-faint);font-weight:var(--fw-m);letter-spacing:.06em;padding:var(--sp-2) var(--sp-4) var(--sp-0);text-transform:uppercase}
.nav-link{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-1) var(--sp-3);margin:1px var(--sp-2);border-radius:var(--r-sm);cursor:pointer;transition:all .1s var(--ease);font-size:var(--fs-sm);color:var(--t-muted);user-select:none;font-weight:var(--fw-n)}
.nav-link:hover{background:var(--c-surface-2);color:var(--t-body)}
.nav-link.active{background:var(--c-primary-bg);color:var(--c-primary);font-weight:var(--fw-m)}
.nav-link svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* Topbar — 44px, functional only */
.topbar{height:var(--top-h);background:var(--c-surface-1);border-bottom:1px solid var(--c-border-soft);display:flex;align-items:center;padding:0 var(--sp-4);gap:var(--sp-3);flex-shrink:0}
.topbar-bc{font-size:var(--fs-sm);color:var(--t-muted);display:flex;align-items:center;gap:var(--sp-1)}
.topbar-bc .sep{color:var(--c-border)}
.topbar-bc .cur{color:var(--t-heading);font-weight:var(--fw-m)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:var(--sp-3)}
.topbar-search{padding:var(--sp-1) var(--sp-2);font-size:var(--fs-xs);border:1px solid var(--c-border-soft);border-radius:var(--r-sm);background:var(--c-surface-0);color:var(--t-faint);width:120px;text-align:center}
.topbar-av{width:26px;height:26px;background:var(--c-primary-bg);border-radius:var(--r-pill);display:flex;align-items:center;justify-content:center;color:var(--c-primary);font-size:var(--fs-xs);font-weight:var(--fw-s)}

.viewport{flex:1;overflow-y:auto;padding:var(--sp-5) var(--sp-6);background:var(--c-surface-0)}

/* =============================================
   Section Header — left accent bar, NOT gradient banner
   ============================================= */
.sec{padding:var(--sp-4) var(--sp-5);background:var(--c-surface-1);border:1px solid var(--c-border-soft);border-radius:var(--r-md);position:relative;margin-bottom:var(--sp-4)}
.sec::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;background:var(--c-primary);border-radius:var(--r-md) 0 0 var(--r-md)}
.sec-title{font-size:var(--fs-lg);font-weight:var(--fw-s);color:var(--t-heading);letter-spacing:-0.02em;line-height:1.25}
.sec-sub{font-size:var(--fs-sm);color:var(--t-muted);margin-top:var(--sp-1);line-height:1.4}
.sec-tags{display:flex;gap:var(--sp-2);margin-top:var(--sp-2);flex-wrap:wrap}
.sec-tag{font-size:var(--fs-xs);padding:2px var(--sp-2);border-radius:var(--r-xs);border:1px solid var(--c-border);color:var(--t-muted);background:var(--c-surface-0);font-weight:var(--fw-m)}
.sec-tag.primary{border-color:var(--c-primary-soft);color:var(--c-primary);background:var(--c-primary-bg)}

/* =============================================
   KPI Row — inline metrics with dividers, NOT 4-card grid
   ============================================= */
.kpi-row{display:flex;align-items:stretch;gap:0;margin-bottom:var(--sp-4);background:var(--c-surface-1);border:1px solid var(--c-border-soft);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4)}
.kpi{display:flex;flex-direction:column;gap:var(--sp-0);padding:var(--sp-2) var(--sp-4);flex:1}
.kpi-label{font-size:var(--fs-xs);color:var(--t-faint);letter-spacing:.02em;font-weight:var(--fw-m)}
.kpi-val{font-size:var(--fs-xl);font-weight:var(--fw-b);color:var(--t-heading);letter-spacing:-0.03em;line-height:1}
.kpi-note{font-size:var(--fs-xs);color:var(--t-muted);margin-top:2px}
.kpi-sep{width:1px;background:var(--c-border-soft);flex-shrink:0}
.kpi.ok .kpi-val{color:var(--c-ok)}
.kpi.warn .kpi-val{color:var(--c-warn)}
.kpi.danger .kpi-val{color:var(--c-danger)}
.kpi.primary .kpi-val{color:var(--c-primary)}

/* =============================================
   Hint — contextual, not flashy
   ============================================= */
.hint{padding:var(--sp-2) var(--sp-3);background:var(--c-primary-bg);border-radius:var(--r-sm);font-size:var(--fs-sm);color:var(--c-primary-soft);margin-bottom:var(--sp-3);border-left:2px solid var(--c-primary);line-height:1.5}

/* =============================================
   Tabs — sharp underline, NOT pill tabs
   ============================================= */
.tabs{display:flex;gap:0;margin-bottom:var(--sp-3);border-bottom:1px solid var(--c-border-soft)}
.tab{padding:var(--sp-2) var(--sp-3);font-size:var(--fs-sm);color:var(--t-muted);cursor:pointer;background:none;border-bottom:2px solid transparent;transition:all .1s var(--ease);font-family:var(--f-ui);font-weight:var(--fw-m)}
.tab:hover{color:var(--t-body);background:var(--c-surface-2)}
.tab.active{color:var(--c-primary);border-bottom-color:var(--c-primary)}

/* =============================================
   Panel — flat section, NOT card-in-card
   ============================================= */
.panel{background:var(--c-surface-1);border:1px solid var(--c-border-soft);border-radius:var(--r-md);overflow:hidden}
.panel-head{padding:var(--sp-2) var(--sp-3);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--c-border-soft);font-size:var(--fs-sm);font-weight:var(--fw-s);color:var(--t-heading)}
.panel-bar{padding:var(--sp-2) var(--sp-3);display:flex;gap:var(--sp-2);align-items:center;border-bottom:1px solid var(--c-border-soft);flex-wrap:wrap;background:var(--c-surface-0)}
.panel-body{padding:var(--sp-3)}

/* =============================================
   Bento Grid — dashboard layout, NOT 3-column cards
   ============================================= */
.bento{display:grid;gap:var(--sp-3);margin-bottom:var(--sp-4)}
.bento-2x2{grid-template-columns:1fr 1fr;grid-template-rows:auto auto}
.bento-70-30{grid-template-columns:7fr 3fr}
.bento-3col{grid-template-columns:3fr 5fr 4fr}
.bento-card{background:var(--c-surface-1);border:1px solid var(--c-border-soft);border-radius:var(--r-md);padding:var(--sp-4);transition:border-color .12s var(--ease)}
.bento-card:hover{border-color:var(--c-primary-soft)}
.bento-card-title{font-size:var(--fs-sm);font-weight:var(--fw-s);color:var(--t-heading);letter-spacing:-0.01em;margin-bottom:var(--sp-2)}
.bento-card-sub{font-size:var(--fs-xs);color:var(--t-muted)}

/* =============================================
   Table — dense ops, NOT padded showcase
   ============================================= */
.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
.tbl th{text-align:left;padding:var(--sp-1) var(--sp-2);font-size:var(--fs-xs);color:var(--t-faint);font-weight:var(--fw-m);border-bottom:1px solid var(--c-border);background:var(--c-surface-0);white-space:nowrap;letter-spacing:.02em}
.tbl td{padding:var(--sp-1) var(--sp-2);color:var(--t-body);border-bottom:1px solid var(--c-border-soft);vertical-align:middle}
.tbl tr:hover td{background:var(--c-surface-2)}

/* =============================================
   Buttons — functional hierarchy
   ============================================= */
.b{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-1);padding:var(--sp-1) var(--sp-3);font-size:var(--fs-sm);font-weight:var(--fw-m);font-family:var(--f-ui);border:1px solid var(--c-border);border-radius:var(--r-sm);cursor:pointer;transition:all .1s var(--ease);background:var(--c-surface-1);color:var(--t-body);user-select:none;line-height:1}
.b:hover{background:var(--c-surface-2);border-color:var(--c-border)}
.b-p{background:var(--c-primary);color:var(--c-primary-text);border-color:var(--c-primary)}
.b-p:hover{background:var(--c-primary-hover)}
.b-xs{padding:2px var(--sp-2);font-size:var(--fs-xs)}
.b-danger{color:var(--c-danger);border-color:var(--c-danger-soft);background:var(--c-danger-bg)}
.b-ok{color:var(--c-ok);border-color:var(--c-ok-soft);background:var(--c-ok-bg)}

/* =============================================
   Status — dot+text, NOT badge-pill
   ============================================= */
.st{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-xs);font-weight:var(--fw-m);white-space:nowrap;line-height:1}
.st-dot{width:5px;height:5px;border-radius:var(--r-pill);flex-shrink:0}
.st.ok .st-dot{background:var(--c-ok)}.st.ok{color:var(--c-ok)}
.st.warn .st-dot{background:var(--c-warn)}.st.warn{color:var(--c-warn)}
.st.danger .st-dot{background:var(--c-danger)}.st.danger{color:var(--c-danger)}
.st.neutral .st-dot{background:var(--t-faint)}.st.neutral{color:var(--t-muted)}
.st.primary .st-dot{background:var(--c-primary)}.st.primary{color:var(--c-primary)}

/* =============================================
   Label — compact tag
   ============================================= */
.lbl{font-size:var(--fs-xs);font-weight:var(--fw-m);padding:2px var(--sp-1);border-radius:var(--r-xs);border:1px solid;white-space:nowrap;line-height:1.5}
.lbl-ok{color:var(--c-ok);border-color:var(--c-ok-soft);background:var(--c-ok-bg)}
.lbl-warn{color:var(--c-warn);border-color:var(--c-warn-soft);background:var(--c-warn-bg)}
.lbl-danger{color:var(--c-danger);border-color:var(--c-danger-soft);background:var(--c-danger-bg)}
.lbl-primary{color:var(--c-primary);border-color:var(--c-primary-soft);background:var(--c-primary-bg)}
.lbl-neutral{color:var(--t-muted);border-color:var(--c-border);background:var(--c-surface-0)}

/* =============================================
   Inputs
   ============================================= */
.inp{padding:var(--sp-1) var(--sp-2);font-size:var(--fs-sm);border:1px solid var(--c-border);border-radius:var(--r-sm);background:var(--c-surface-1);color:var(--t-body);font-family:var(--f-ui);transition:border-color .1s var(--ease)}
.inp:focus{border-color:var(--c-primary-soft);box-shadow:0 0 0 2px var(--c-primary-bg)}
.sel{padding:var(--sp-1) var(--sp-2);font-size:var(--fs-sm);border:1px solid var(--c-border);border-radius:var(--r-sm);background:var(--c-surface-1);color:var(--t-muted);font-family:var(--f-ui);appearance:none;cursor:pointer;min-width:80px}

/* =============================================
   Chat — AIOps specific, asymmetric
   ============================================= */
.chat-wrap{display:grid;grid-template-columns:180px 1fr;gap:0;height:calc(100vh - var(--top-h) - 40px);border:1px solid var(--c-border-soft);border-radius:var(--r-md);overflow:hidden;background:var(--c-surface-1)}
.chat-side{background:var(--c-surface-0);border-right:1px solid var(--c-border-soft);padding:var(--sp-2);display:flex;flex-direction:column;gap:var(--sp-1)}
.chat-side-label{font-size:var(--fs-xs);color:var(--t-faint);font-weight:var(--fw-m);padding:var(--sp-1) var(--sp-2);letter-spacing:.04em;text-transform:uppercase}
.chat-item{padding:var(--sp-1) var(--sp-2);border-radius:var(--r-sm);cursor:pointer;font-size:var(--fs-sm);color:var(--t-muted);transition:background .08s var(--ease);font-weight:var(--fw-n)}
.chat-item:hover{background:var(--c-surface-2)}
.chat-item.active{background:var(--c-primary-bg);color:var(--c-primary);font-weight:var(--fw-m)}
.chat-area{display:flex;flex-direction:column}
.chat-msgs{flex:1;padding:var(--sp-3);overflow-y:auto;display:flex;flex-direction:column;gap:var(--sp-3)}
.chat-msg{max-width:76%;padding:var(--sp-2) var(--sp-3);border-radius:var(--r-md);font-size:var(--fs-sm);line-height:1.6}
.chat-msg.u{background:var(--c-primary);color:var(--c-primary-text);align-self:flex-end;border-bottom-right-radius:var(--r-xs)}
.chat-msg.ai{background:var(--c-surface-2);color:var(--t-body);align-self:flex-start;border-bottom-left-radius:var(--r-xs)}
.chat-msg.ai .ai-label{font-size:var(--fs-xs);color:var(--c-primary);font-weight:var(--fw-s);margin-bottom:var(--sp-1);letter-spacing:.02em}
.chat-bar{padding:var(--sp-2) var(--sp-3);border-top:1px solid var(--c-border-soft);display:flex;gap:var(--sp-2);align-items:center}
.chat-inp{flex:1;padding:var(--sp-2) var(--sp-3);border:1px solid var(--c-border);border-radius:var(--r-sm);font-size:var(--fs-sm);font-family:var(--f-ui);background:var(--c-surface-1);resize:none;height:36px}

/* =============================================
   Tree Nav — K8s specific
   ============================================= */
.tree{width:176px;border-right:1px solid var(--c-border-soft);background:var(--c-surface-0);padding:var(--sp-2);flex-shrink:0}
.tree-node{padding:var(--sp-1) var(--sp-2);font-size:var(--fs-sm);color:var(--t-muted);cursor:pointer;border-radius:var(--r-xs);display:flex;align-items:center;gap:var(--sp-1);margin:1px 0;transition:background .08s var(--ease);font-weight:var(--fw-n)}
.tree-node:hover{background:var(--c-surface-2);color:var(--t-body)}
.tree-node.active{background:var(--c-primary-bg);color:var(--c-primary);font-weight:var(--fw-m)}
.tree-node.d1{padding-left:var(--sp-4)}
.tree-node.d2{padding-left:var(--sp-6)}

/* =============================================
   Code Block — ops terminal feel
   ============================================= */
.code{background:#0f1d2e;border-radius:var(--r-md);padding:var(--sp-2);font-family:var(--f-mono);font-size:var(--fs-sm);color:#94a3b8;overflow:auto;border:1px solid #1e3a5f;line-height:1.6}
.code .kw{color:var(--c-primary-soft)}.code .fn{color:var(--c-ok)}.code .str{color:var(--c-warn)}

/* =============================================
   Chart placeholder
   ============================================= */
.chart-box{background:var(--c-surface-1);border:1px solid var(--c-border-soft);border-radius:var(--r-md);padding:var(--sp-3)}
.chart-title{font-size:var(--fs-sm);font-weight:var(--fw-s);color:var(--t-heading);margin-bottom:var(--sp-2)}
.chart-area{height:140px;background:var(--c-surface-0);border-radius:var(--r-sm);position:relative;overflow:hidden}

/* =============================================
   Host Grid — functional, NOT decorative
   ============================================= */
.host-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:var(--sp-2)}
.host{background:var(--c-surface-1);border:1px solid var(--c-border-soft);border-radius:var(--r-sm);padding:var(--sp-3);cursor:pointer;transition:border-color .1s var(--ease)}
.host:hover{border-color:var(--c-primary-soft)}
.host-name{font-size:var(--fs-sm);font-weight:var(--fw-s);color:var(--t-heading)}
.host-ip{font-size:var(--fs-xs);color:var(--t-muted);margin-top:2px}
.host-st{font-size:var(--fs-xs);margin-top:var(--sp-1)}

/* =============================================
   Toggle
   ============================================= */
.toggle{width:30px;height:16px;background:var(--c-border);border-radius:var(--r-pill);position:relative;cursor:pointer;transition:background .1s var(--ease)}
.toggle.on{background:var(--c-primary)}
.toggle-dot{width:12px;height:12px;background:var(--c-surface-1);border-radius:var(--r-pill);position:absolute;top:2px;left:2px;transition:left .1s var(--ease)}
.toggle.on .toggle-dot{left:16px}

/* =============================================
   Login — asymmetric split
   ============================================= */
.login-split{display:grid;grid-template-columns:5fr 4fr;height:100vh}
.login-brand{background:var(--c-primary);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:var(--sp-12) var(--sp-10);color:var(--c-primary-text)}
.login-brand-mark{width:36px;height:36px;background:rgba(255,255,255,.12);border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;font-size:var(--fs-lg);font-weight:var(--fw-b)}
.login-brand-title{font-size:var(--fs-3xl);font-weight:var(--fw-b);margin-top:var(--sp-4);letter-spacing:-0.03em}
.login-brand-sub{font-size:var(--fs-md);opacity:.7;margin-top:var(--sp-2);line-height:1.5}
.login-brand-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);margin-top:var(--sp-8)}
.login-brand-cell{background:rgba(255,255,255,.06);border-radius:var(--r-md);padding:var(--sp-3);border:1px solid rgba(255,255,255,.1)}
.login-brand-cell h{font-size:var(--fs-sm);font-weight:var(--fw-m)}
.login-brand-cell p{font-size:var(--fs-xs);opacity:.6;margin-top:2px}
.login-form-area{background:var(--c-surface-1);display:flex;align-items:center;justify-content:center;padding:var(--sp-8)}
.login-form{width:320px}
.login-form-title{font-size:var(--fs-xl);font-weight:var(--fw-s);color:var(--t-heading);letter-spacing:-0.02em}
.login-form-sub{font-size:var(--fs-sm);color:var(--t-muted);margin-top:var(--sp-1);margin-bottom:var(--sp-5)}
.fld{margin-bottom:var(--sp-3)}
.fld-label{font-size:var(--fs-xs);color:var(--t-muted);font-weight:var(--fw-m);margin-bottom:var(--sp-1);display:block}
.fld-ctrl{width:100%;padding:var(--sp-2) var(--sp-3);font-size:var(--fs-md);border:1px solid var(--c-border);border-radius:var(--r-sm);font-family:var(--f-ui);background:var(--c-surface-1);color:var(--t-body);transition:border-color .1s var(--ease)}
.fld-ctrl:focus{border-color:var(--c-primary-soft);box-shadow:0 0 0 2px var(--c-primary-bg)}
.fld-hint{font-size:var(--fs-xs);color:var(--t-faint);margin-top:var(--sp-1)}

/* =============================================
   Source Cards
   ============================================= */
.src-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--sp-2)}
.src{background:var(--c-surface-1);border:1px solid var(--c-border-soft);border-radius:var(--r-sm);padding:var(--sp-3)}
.src-head{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-1)}
.src-icon{width:26px;height:26px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-size:var(--fs-xs);font-weight:var(--fw-s)}
.src-icon.primary{background:var(--c-primary-bg);color:var(--c-primary)}
.src-icon.ok{background:var(--c-ok-bg);color:var(--c-ok)}
.src-icon.warn{background:var(--c-warn-bg);color:var(--c-warn)}
.src-name{font-size:var(--fs-sm);font-weight:var(--fw-m);color:var(--t-heading)}
.src-desc{font-size:var(--fs-xs);color:var(--t-muted)}
.src-count{font-size:var(--fs-xs);color:var(--t-faint);margin-top:var(--sp-1)}

/* =============================================
   Pagination
   ============================================= */
.pg-bar{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2);border-top:1px solid var(--c-border-soft);font-size:var(--fs-xs);color:var(--t-faint)}
.pg-btn{padding:2px var(--sp-2);border:1px solid var(--c-border);border-radius:var(--r-xs);cursor:pointer;background:var(--c-surface-1);font-size:var(--fs-xs)}
.pg-btn.active{background:var(--c-primary);color:var(--c-primary-text);border-color:var(--c-primary)}

/* =============================================
   Graph visualization
   ============================================= */
.graph-vp{background:var(--c-surface-1);border:1px solid var(--c-border-soft);border-radius:var(--r-md);height:340px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.g-node{position:absolute;padding:var(--sp-1) var(--sp-2);border-radius:var(--r-sm);font-size:var(--fs-xs);text-align:center;font-weight:var(--fw-m)}
.g-node.primary{background:var(--c-primary-bg);border:2px solid var(--c-primary);color:var(--c-primary)}
.g-node.ok{background:var(--c-ok-bg);border:2px solid var(--c-ok);color:var(--c-ok)}
.g-node.neutral{background:var(--c-surface-2);border:2px solid var(--c-border);color:var(--t-muted)}

/* =============================================
   Grafana dark frame
   ============================================= */
.grafana{background:#0f1d2e;border-radius:var(--r-md);border:2px solid #1e3a5f;min-height:300px;display:flex;align-items:center;justify-content:center;color:var(--t-muted);font-size:var(--fs-sm);position:relative;overflow:hidden}

/* =============================================
   Timeline bar
   ============================================= */
.tl-bar{height:32px;background:var(--c-surface-0);border-radius:var(--r-sm);position:relative;margin-bottom:var(--sp-2);border:1px solid var(--c-border-soft)}
.tl-dot{position:absolute;width:6px;height:6px;border-radius:var(--r-pill);top:13px}

/* =============================================
   Module Row
   ============================================= */
.mod-row{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-2) var(--sp-3);border-bottom:1px solid var(--c-border-soft)}
.mod-name{font-size:var(--fs-sm);font-weight:var(--fw-m);color:var(--t-heading);flex:1}
.mod-desc{font-size:var(--fs-xs);color:var(--t-muted);flex:2}

/* Scrollbar */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--c-border);border-radius:var(--r-pill)}
::-webkit-scrollbar-thumb:hover{background:var(--t-faint)}

/* Animation */
.page-in{animation:pgIn .2s var(--ease)}
@keyframes pgIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>

/* ── 仪表盘: Bento Grid — NOT cookie-cutter hero+stats ── */

  + '<div class="bento-card" style="margin-bottom:var(--sp-3)">'
  + '<div style="display:flex;justify-content:space-between;align-items:baseline"><span class="kpi-val" style="font-size:var(--fs-2xl);color:var(--c-ok)">24</span><span style="font-size:var(--fs-xs);color:var(--t-muted)">今日 +6</span></div>'
  + '<div style="font-size:var(--fs-xs);color:var(--t-faint);margin-top:2px">AI 会话 · 本周累计</div>'
  + '</div>'
  + '<div class="bento-card">'
  + '<div style="display:flex;justify-content:space-between;align-items:baseline"><span class="kpi-val" style="font-size:var(--fs-lg)">8</span><span style="font-size:var(--fs-xs);color:var(--t-muted)">本周 +3</span></div>'
  + '<div style="font-size:var(--fs-xs);color:var(--t-faint);margin-top:2px">部署工单</div>'
  + '</div>'
  + '</div>'
  /* Col 2: Host health grid */
  + '<div>'
  + '<div class="bento-card">'
  + '<div class="bento-card-title">主机健康状态</div>'
  + '<div class="host-grid">'

/* ── Helper functions ── */
function sec(title,sub,tags){
  let h='<div class="sec">';
  h+='<div class="sec-title">'+title+'</div>';
  if(sub)h+='<div class="sec-sub">'+sub+'</div>';
  if(tags){h+='<div class="sec-tags">';tags.forEach(t=>{h+='<span class="sec-tag'+(t[1]?' primary':'')+'">'+t[0]+'</span>';});h+='</div>';}
  h+='</div>';return h;
}

function kpiRow(items){
  let h='<div class="kpi-row">';
  items.forEach((it,i)=>{
    if(i>0)h+='<div class="kpi-sep"></div>';
    h+='<div class="kpi'+(it[3]?' '+it[3]:'')+'"><div class="kpi-label">'+it[0]+'</div><div class="kpi-val">'+it[1]+'</div>';
    if(it[2])h+='<div class="kpi-note">'+it[2]+'</div>';
    h+='</div>';
  });
  h+='</div>';return h;
}

function hint(text){return '<div class="hint">'+text+'</div>';}

function tabs(items,active){
  let h='<div class="tabs">';
  items.forEach((t,i)=>{h+='<button class="tab'+(i===active?' active':'')+'" onclick="this.parentElement.querySelectorAll(\'.tab\').forEach(b=>b.classList.remove(\'active\'));this.classList.add(\'active\')">'+t+'</button>';});
  h+='</div>';return h;
}

function panel(title,bar,body){
  let h='<div class="panel">';
  h+='<div class="panel-head"><span>'+title+'</span><div style="display:flex;gap:var(--sp-2)"><button class="b b-xs">'+IC.refresh+' 刷新</button></div></div>';
  if(bar)h+='<div class="panel-bar">'+bar+'</div>';
  h+='<div class="panel-body">'+body+'</div>';
  h+='</div>';return h;
}

function tbl(hd,rows){
  let h='<table class="tbl"><thead><tr>';
  hd.forEach(c=>h+='<th>'+c+'</th>');
  h+='</tr></thead><tbody>';
  rows.forEach(r=>{h+='<tr>';r.forEach(c=>h+='<td>'+c+'</td>');h+='</tr>';});
  h+='</tbody></table>';return h;
}

function pgBar(){return '<div class="pg-bar"><span>共 128 条</span><button class="pg-btn">1</button><button class="pg-btn active">2</button><button class="pg-btn">3</button><button class="pg-btn">…</button><button class="pg-btn">13</button></div>';}

function fl(items){
  let h='<div style="display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap">';
  h+='<div class="inp" style="width:120px;text-align:center;color:var(--t-faint);font-size:var(--fs-xs)">'+IC.search+' 搜索…</div>';
  items.forEach(f=>h+='<select class="sel"><option>'+f+'</option></select>');
  h+='</div>';return h;
}
